name: Build

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "webrtc-jni/src/main/cpp/dependencies/webrtc/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  WEBRTC_CHECKOUT_FOLDER: webrtc
  WEBRTC_INSTALL_FOLDER: webrtc/build

jobs:
  build-windows:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: windows_x86_64
            runs-on: windows-2022
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare
        name: Prepare build
        uses: ./.github/actions/prepare-windows

      - id: maven-build
        name: Maven build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          maven-username: ${{ secrets.MAVEN_USERNAME }}
          maven-password: ${{ secrets.MAVEN_TOKEN }}

      # 新增：上传 Windows 构建文件
      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-java-${{ matrix.platform.name }}
          path: |
            **/target/*.jar
            **/target/*.pom
            **/target/*.dll
            **/target/*.lib
            **/target/*.pdb
          if-no-files-found: warn
          retention-days: 7

  build-linux:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux_arm
            runs-on: ubuntu-22.04
          - name: linux_arm64
            runs-on: ubuntu-22.04
          - name: linux_x86-64
            runs-on: ubuntu-22.04
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare
        name: Prepare build
        uses: ./.github/actions/prepare-linux

      - id: maven-build
        name: Maven build
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          maven-username: ${{ secrets.MAVEN_USERNAME }}
          maven-password: ${{ secrets.MAVEN_TOKEN }}

      # 新增：上传 Linux 构建文件
      - name: Upload Linux build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-java-${{ matrix.platform.name }}
          path: |
            **/target/*.jar
            **/target/*.pom
            **/target/*.so
            **/target/*.a
          if-no-files-found: warn
          retention-days: 7

  build-macos:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: macos_x86-64
            runs-on: macos-15
          - name: macos_arm64
            runs-on: macos-15
        java: [17]
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - id: prepare-build
        name: Prepare build
        uses: ./.github/actions/prepare-macos

      - id: maven-build-arm64
        name: Maven build - Apple Silicon
        if: matrix.platform.name == 'macos_arm64'
        uses: ./.github/actions/build
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          maven-username: ${{ secrets.MAVEN_USERNAME }}
          maven-password: ${{ secrets.MAVEN_TOKEN }}

      - id: maven-build-x86_64
        name: Maven build - Intel
        if: matrix.platform.name == 'macos_x86-64'
        uses: ./.github/actions/build-macos-x86_64
        with:
          java-version: ${{ matrix.java }}
          platform-name: ${{ matrix.platform.name }}
          maven-username: ${{ secrets.MAVEN_USERNAME }}
          maven-password: ${{ secrets.MAVEN_TOKEN }}

      # 新增：上传 macOS 构建文件
      - name: Upload macOS build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webrtc-java-${{ matrix.platform.name }}
          path: |
            **/target/*.jar
            **/target/*.pom
            **/target/*.dylib
            **/target/*.a
          if-no-files-found: warn
          retention-days: 7